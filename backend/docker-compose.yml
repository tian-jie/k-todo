version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: k-todo-postgres
    environment:
      POSTGRES_DB: k_todo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d k_todo"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: k-todo-backend
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/k_todo
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
